    S4:
      go: SM-06、SM-12、SM-13、SM-14 与 SM-16 通过。
      stop_or_narrow: 无法证明副作用一致性和市场规则正确时，不启用 Agent 模拟交易。
    S5:
      go: 全部 v1.0 SM 与 NFR 证据通过。
      stop_or_narrow: 未满足的能力切片保持 beta，不以 v1.0 发布。
  scope_exclusions:
    - 实盘下单、券商连接、跟单、自动交易、投资顾问及无人值守交易。
    - ETF、场外基金、债券、期货、期权、外汇、加密、美股及其他全球资产的一等支持。
    - 用户、组织、RBAC、多租户、陌生用户共享、官方托管 SaaS 或跨主机拓扑。
    - 社交、直播、课程、公开脚本社区、在线插件市场、远程一键安装或受支持的外部公共 REST API。
    - 内置、转售或绕授权取得商用数据；自动多模型路由、多 Agent 编排；模型下载、量化、GPU 或推理服务运维。
