name: quality

on:
  pull_request:
  push:
    branches: [main, 'codex/**']

env:
  HUSKY: '0'

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.20.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master snapshot 2026-08-28
        with:
          toolchain: 1.98.0
          components: rustfmt,clippy
      - run: pnpm install --frozen-lockfile
      - run: pnpm dependencies:check
      - run: rustc --version | grep -F 'rustc 1.98.0'
      - run: cargo --version | grep -F 'cargo 1.98.0'
      - run: rustfmt --version | grep -F 'rustfmt 1.9.0-stable'
      - run: cargo clippy --version | grep -F 'clippy 0.1.98'
      - run: pnpm lint

  format-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.20.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master snapshot 2026-08-28
        with:
          toolchain: 1.98.0
          components: rustfmt,clippy
      - run: pnpm install --frozen-lockfile
      - run: pnpm dependencies:check
      - run: rustc --version | grep -F 'rustc 1.98.0'
      - run: cargo --version | grep -F 'cargo 1.98.0'
      - run: rustfmt --version | grep -F 'rustfmt 1.9.0-stable'
      - run: cargo clippy --version | grep -F 'clippy 0.1.98'
      - run: pnpm format:check

  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.20.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master snapshot 2026-08-28
        with:
          toolchain: 1.98.0
          components: rustfmt,clippy
      - run: pnpm install --frozen-lockfile
      - run: pnpm dependencies:check
      - run: rustc --version | grep -F 'rustc 1.98.0'
      - run: cargo --version | grep -F 'cargo 1.98.0'
      - run: rustfmt --version | grep -F 'rustfmt 1.9.0-stable'
      - run: cargo clippy --version | grep -F 'clippy 0.1.98'
      - run: pnpm typecheck

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.20.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master snapshot 2026-08-28
        with:
          toolchain: 1.98.0
          components: rustfmt,clippy
      - run: pnpm install --frozen-lockfile
      - run: pnpm dependencies:check
      - run: rustc --version | grep -F 'rustc 1.98.0'
      - run: cargo --version | grep -F 'cargo 1.98.0'
      - run: rustfmt --version | grep -F 'rustfmt 1.9.0-stable'
      - run: cargo clippy --version | grep -F 'clippy 0.1.98'
      - run: pnpm build

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.20.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master snapshot 2026-08-28
        with:
          toolchain: 1.98.0
          components: rustfmt,clippy
      - run: pnpm install --frozen-lockfile
      - run: pnpm dependencies:check
      - run: rustc --version | grep -F 'rustc 1.98.0'
      - run: cargo --version | grep -F 'cargo 1.98.0'
      - run: rustfmt --version | grep -F 'rustfmt 1.9.0-stable'
      - run: cargo clippy --version | grep -F 'clippy 0.1.98'
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test
